name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover scripts -p 'test_*.py'
      - name: Validate skill
        run: python3 scripts/validate_skill.py .
      - name: Audit repository skill
        run: python3 scripts/audit_skill.py . --request "validate repository skill"
